[package]
name = "forgepad-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs", "set-header"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database ORM
diesel = { version = "2.3.7", features = [
    "postgres",
    "numeric",
    "chrono",
    "serde_json",
] }
diesel-async = { version = "0.8.0", features = ["postgres", "deadpool"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
deadpool = "0.13.0"

# Redis
redis = { version = "1.1.0", features = ["tokio-comp", "connection-manager"] }

# EVM / Blockchain
alloy = { version = "1.8.3", features = [
    "full",
    "node-bindings",
    "reqwest",
    "providers",
    "rpc-types",
    "transport-http",
] }
alloy-provider = { version = "1.8.3", features = ["ws", "reqwest"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Rate limiting
governor = "0.10.4"

# Concurrent maps
dashmap = "6.1.0"

# Socket.IO (compatible with socket.io-client in frontend)
socketioxide = { version = "0.18.2", features = ["state"] }

# Crypto (EIP-191 signature recovery)
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha3 = "0.10.8"
hex = "0.4.3"

# JWT (LiveKit access-token minting, HS256)
jsonwebtoken = "9"

# S3 / MinIO
aws-sdk-s3 = { version = "1", features = ["rt-tokio", "behavior-version-latest"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.2", features = ["json"] }
regex-lite = "0.1.9"
base64 = "0.22"
futures = "0.3.32"
rand = { version = "0.10.0" }

# TLS for Supabase/PostgreSQL connections
tokio-postgres = "0.7"
openssl = "0.10"
postgres-openssl = "0.5"
