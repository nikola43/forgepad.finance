server {
    listen 3002;
    server_name _;
    root /home/user_msng03m9/fyuz/frontend/out;
    index index.html;

    # Content-hashed build output: the filename changes whenever the bytes do,
    # so these can be cached forever. The previous config sent no Cache-Control
    # here at all and Cloudflare applied its own 4h default, which meant a
    # deploy's assets kept being served from the edge after the origin moved on.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else — chiefly the HTML entry points, which are NOT
    # content-hashed and are what point at the current build's chunks. With no
    # Cache-Control at all (the previous behaviour) browsers fall back to
    # heuristic freshness off Last-Modified, so a visitor could keep replaying a
    # stale app shell for hours after a deploy and see fixed code as still
    # broken. must-revalidate forces a conditional request every time: a 304 is
    # cheap, and a deploy takes effect on the next load.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
