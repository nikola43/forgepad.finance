server {
    listen 80;

    # Legacy URLs that already include the bucket (on-chain metadata, cached
    # links) must keep resolving, so pass them through untouched.
    location /forgepad/ {
        proxy_pass http://minio:9000;
    }

    # Public short URLs: /<object> -> MinIO /forgepad/<object>
    location / {
        proxy_pass http://minio:9000/forgepad/;
    }
}
