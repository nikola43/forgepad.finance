name: SDKs

# Four clients over one API. They only stay in step because the same
# sdk/shared/test-vectors fixtures drive a conformance suite in each of them, so
# every job here re-reads those files — a change to the wire contract has to be
# made in all four places or this workflow goes red.
on:
  push:
    branches: [master]
    paths: ['sdk/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['sdk/**', '.github/workflows/sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # The package supports Node 18+ (native fetch). 18 is the floor worth
          # proving; 22 is what most consumers actually run.
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          # The client has no dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # Builds the examples/ commands too — they are package main in the same module.
      - run: go build ./...
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range; the versions in
        # between do not diverge in ways this dependency-free client can see.
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # tests/ joins src/ on the path: the suite imports its stub server and
      # payload fixtures as top-level modules.
      - run: PYTHONPATH=src:tests python -m unittest discover -s tests -t tests -v
      - name: lint and type-check
        run: |
          pip install --quiet 'mypy>=1.8' 'ruff>=0.4'
          ruff check src tests examples
          mypy
        # mypy refuses targets below 3.10, so this half only runs on the newer job.
        if: matrix.python != '3.9'

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Nothing else compiles the examples, so they rot silently without this.
      - run: cargo build --examples
