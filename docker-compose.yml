services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forgepad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-rs/migrations/00000000000000_create_schema/up.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--fork-url"
      - "https://ethereum-rpc.publicnode.com"
      - "--chain-id"
      - "31337"
      - "--block-time"
      - "2"
      - "--host"
      - "0.0.0.0"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "bn", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 20

  contract-deployer:
    build:
      context: ./foundry
      dockerfile: Dockerfile
    environment:
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    depends_on:
      anvil:
        condition: service_healthy
    profiles:
      - deploy

  backend:
    build:
      context: ./backend-rs
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forgepad
      REDIS_URL: redis://redis:6379
      ETH_RPC_URL: http://anvil:8545
      ETH_PUBLIC_RPC_URL: http://127.0.0.1:8545
      ETH_WS_URL: ws://anvil:8545
      CHAIN_ID: "31337"
      PORT: "5001"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
      API_KEY: hola
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: http://localhost:5001/uploads
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: forgepad
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9000/forgepad
      RUST_LOG: info,forgepad_backend=debug
    ports:
      - "5001:5001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/forgepad --ignore-existing &&
      mc anonymous set public local/forgepad &&
      echo 'Bucket forgepad created and public' &&
      exit 0
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID:-ff3f4d54247f143a5f879f9a104d8662}
        NEXT_PUBLIC_LOCAL_MODE: "true"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  minio_data:
