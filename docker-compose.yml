services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgepad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 is taken by another app on this host (basslab-db).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb runs these ONCE, on an empty data dir, in filename order. A pgdata
      # volume created by an older schema is NEVER re-initialised, so it silently
      # drifts from the repo (missing tables/columns surface as 500s like
      # 'relation "watchlist" does not exist'). Wipe the volume to re-seed:
      #   docker compose down -v   (or scripts/localnet.sh --reset-db)
      # Every migration must be listed here, or the DB only ever gets the base schema.
      - ./backend-rs/migrations/00000000000000_create_schema/up.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend-rs/migrations/2026-07-14-000000_add_direct_pool_type/up.sql:/docker-entrypoint-initdb.d/02-add-direct-pool-type.sql
      - ./backend-rs/migrations/2026-07-17-000000_add_image_style/up.sql:/docker-entrypoint-initdb.d/03-add-image-style.sql
      - ./backend-rs/migrations/2026-07-17-100000_referral_referee_unique/up.sql:/docker-entrypoint-initdb.d/04-referral-referee-unique.sql
      - ./backend-rs/migrations/2026-07-19-000000_add_distributor_rounds/up.sql:/docker-entrypoint-initdb.d/05-distributor-rounds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend-rs
      dockerfile: Dockerfile
    # This host's Docker DNS flakes intermittently; a startup panic (e.g. the
    # Redis connect) must not leave the API permanently down.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forgepad
      REDIS_URL: redis://redis:6379
      # Browser-facing RPC: returned via /config and used by the BROWSER, so it must
      # be reachable from the user's machine — not from inside this container. On a
      # localnet that means 127.0.0.1, while the server vars below point at
      # host.docker.internal. Keep them independently overridable for that reason.
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.bnbchain.org}
      BSC_PUBLIC_RPC_URL: ${BSC_PUBLIC_RPC_URL:-${BSC_RPC_URL:-https://bsc-dataseed.bnbchain.org}}
      # Server-side RPC: indexing getLogs + eth_call, resolved from inside the
      # container. Supports large ranges the browser-facing provider does not.
      ETH_RPC_URL: ${BSC_SERVER_RPC_URL:-https://bsc-dataseed.bnbchain.org}
      # WS newHeads subscription (browser-facing, same reachability caveat).
      BSC_WS_URL: ${BSC_WS_URL:-wss://bsc-ws-node.nariox.org}
      BSC_EXPLORER_URL: ${BSC_EXPLORER_URL:-https://bscscan.com}
      # BNB Smart Chain. chains.rs reads CHAIN_ID first, so this drives what /config
      # advertises — it must match the chain the RPC actually serves, or every wallet
      # tx targets the wrong network. 56 for real BSC; a localnet fork overrides this
      # with its own id (see scripts/localnet.sh).
      CHAIN_ID: ${CHAIN_ID:-56}
      # The deployed Fyuz proxy on BSC. Required (the indexer fails closed rather
      # than defaulting to a stale address that would silently index nothing).
      FYUZ_CONTRACT_ADDRESS: ${FYUZ_CONTRACT_ADDRESS:?FYUZ_CONTRACT_ADDRESS must be set}
      # Block to start indexing from on a FRESH database. BSC is ~110M blocks deep
      # and nothing before the Fyuz deployment can contain our events, so leaving
      # this at 0 makes the indexer backfill the whole chain and never reach head.
      # Set it to the deployment block (or the anvil fork block on a localnet).
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      # Reorg confirmation depth for the indexer (0 = index at head; localnet fork
      # sets 0, production should use a safe lag like 12).
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-12}
      PORT: "5001"
      # :3000 = npm-dev frontend, :3002 = the dockerised frontend service below.
      CORS_ORIGINS: "https://fyuz.fun,https://www.fyuz.fun,https://fyuz.host-ia.online,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8080"
      # Fusion image generation: "openai" (default) drives any OpenAI-compatible
      # Images API and fails loudly without OPENAI_API_KEY; "local" runs
      # stable-diffusion.cpp on this host's CPU against the GGUF below (slow —
      # minutes per image — but free/offline); localnet.sh sets "mock" so the
      # flow works offline.
      IMAGE_GEN_PROVIDER: ${IMAGE_GEN_PROVIDER:-openai}
      # Default provider is Together AI's gpt-image-1.5. OPENAI_API_KEY holds the
      # bearer token for whichever base is set — put your Together API key here.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.together.xyz/v1}
      # Model for text-only fusions (no reference photo found).
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-openai/gpt-image-1.5}
      # Model used when Wikipedia reference portraits ARE found (blends real
      # faces via reference_images — far better likeness).
      OPENAI_IMAGE_MODEL_REF: ${OPENAI_IMAGE_MODEL_REF:-openai/gpt-image-1.5}
      # Square output edge in px. Leave OPENAI_IMAGE_STEPS unset for gpt-image-1.5
      # (it rejects "steps"); set ~28 only for models like gpt-image-2.
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024}
      # BNB paid per leaderboard/bonus point (~0.57% of net volume at $569/BNB;
      # must stay below the 1% protocol fee or point farming becomes profitable).
      POINT_REWARD_BNB: ${POINT_REWARD_BNB:-0.00001}
      SD_MODEL_PATH: ${SD_MODEL_PATH:-/models/sd_turbo-f16-q8_0.gguf}
      SD_THREADS: ${SD_THREADS:-2}
      SD_STEPS: ${SD_STEPS:-4}
      API_KEY: hola
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-https://api.fyuz.fun/uploads}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: forgepad
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      # Where the BROWSER fetches uploaded images from, so it must be resolvable
      # from the user's machine — S3_ENDPOINT above is container-internal only.
      # On a localnet this points at the local MinIO (http://localhost:9000/<bucket>);
      # in production, at the real CDN/S3 domain, which must actually exist in DNS.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://s3.fyuz.fun/forgepad}
      RUST_LOG: info,forgepad_backend=debug
      # LiveKit (native streaming). Keys must match the livekit service's
      # LIVEKIT_KEYS. LIVEKIT_URL is the public wss the browser connects to.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret_change_me_min_32_chars_long}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://livekit.fyuz.fun}
    ports:
      - "5002:5001"
    volumes:
      - uploads:/app/uploads
      # GGUF weights for IMAGE_GEN_PROVIDER=local (kept on the host, gitignored).
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Native WebRTC streaming SFU (Tier C). Signaling on 7880; media on 7881/tcp +
  # 50000-50100/udp. Behind the cloudflared tunnel, expose 7880 as wss on a
  # subdomain (e.g. livekit.fyuz.fun) and enable TURN in livekit/livekit.yaml.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    environment:
      # Overrides `keys:` in the config file — no secret committed.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_change_me_min_32_chars_long}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Public gateway for uploaded images. MinIO requires the bucket in the path,
  # but public URLs are bucket-less (https://fyuz-s3.host-ia.online/<file>) —
  # the cloudflared tunnel points here and this injects /forgepad/.
  s3-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9002:80"
    volumes:
      - ./config/s3-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_healthy

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/forgepad --ignore-existing &&
      mc anonymous set public local/forgepad &&
      echo 'Bucket forgepad created and public' &&
      exit 0
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID:-ff3f4d54247f143a5f879f9a104d8662}
        NEXT_PUBLIC_LOCAL_MODE: ${NEXT_PUBLIC_LOCAL_MODE:-false}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.fyuz.fun}
        # Browser-facing RPC/chain id — on a localnet these must be the host-reachable
        # anvil (127.0.0.1) and its chain id, same caveat as BSC_PUBLIC_RPC_URL above.
        NEXT_PUBLIC_BSC_RPC_URL: ${BSC_PUBLIC_RPC_URL:-${BSC_RPC_URL:-https://bsc-dataseed.bnbchain.org}}
        NEXT_PUBLIC_BSC_CHAIN_ID: ${CHAIN_ID:-56}
        NEXT_PUBLIC_BSC_EXPLORER_URL: ${BSC_EXPLORER_URL:-https://bscscan.com}
    restart: unless-stopped
    ports:
      # 3001 is taken by another app on this host (crm-hostia-api).
      - "3002:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  minio_data:
